name: mvn

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mvn
      POSTGRES_PASSWORD: mvn
      POSTGRES_DB: mvn
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mvn -d mvn"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  storage:
    image: localstack/localstack:3.6
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
    volumes:
      - miniodata:/var/lib/localstack

volumes:
  pgdata:
  miniodata:
