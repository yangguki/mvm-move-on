<div class="na-stage">
  <div class="na-scan"></div>
  <div class="na-floor"></div>
  <main class="na-preview-layout">
    <p class="na-lbl">NEXT PREVIEW</p>
    <h1 class="na-title" style="font-size:64px">{{label}}</h1>
    <p class="na-timer" style="font-size:120px">{{remainingSec}}</p>
    <div class="na-preview-row">
      <div data-mvn-next-video class="na-next-v" style="width:480px;height:270px"></div>
      <div class="na-panel" style="padding:28px;min-width:420px">
        <p class="na-lbl">NEXT</p>
        <p class="na-sub" style="font-size:36px;color:var(--fg)">{{next.label}}</p>
        <div class="na-muscles">사용 근육 (2단계)</div>
      </div>
    </div>
  </main>
</div>
