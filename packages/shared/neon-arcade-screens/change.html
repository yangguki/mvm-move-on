<div class="na-stage">
  <div class="na-scan"></div>
  <div class="na-floor"></div>
  <header class="na-top"><img class="na-logo" src="{{logoUrl}}" alt=""><span class="na-prog">{{program.name}}</span></header>
  <main class="na-center">
    <p class="na-lbl">STATION CHANGE</p>
    <h1 class="na-title" style="font-size:72px">{{label}}</h1>
    <p class="na-timer">{{remainingSec}}</p>
    <div class="na-chips">
      <div class="na-chip"><em>1</em> 머신 그룹은 플로어로</div>
      <div class="na-chip"><em>2</em> 플로어 그룹은 머신으로</div>
    </div>
  </main>
</div>
