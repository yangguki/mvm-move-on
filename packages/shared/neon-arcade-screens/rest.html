<div class="na-stage">
  <div class="na-scan"></div>
  <div class="na-floor"></div>
  <main class="na-rest-layout">
    <div>
      <p class="na-lbl">REST</p>
      <h1 class="na-title" style="font-size:120px">{{label}} 휴식</h1>
      <p class="na-timer" style="font-size:160px">{{remainingSec}}</p>
      <p class="na-sub">{{next.label}}</p>
    </div>
    <div class="na-panel" style="padding:20px;display:flex;flex-direction:column;gap:16px;align-items:center">
      <span class="na-lbl">NEXT</span>
      <div data-mvn-next-video class="na-next-v"></div>
      <p class="na-meta" style="text-align:center;max-width:360px">{{next.label}}</p>
    </div>
  </main>
</div>
