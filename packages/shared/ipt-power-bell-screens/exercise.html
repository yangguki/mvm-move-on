<div class="ipb-stage ipb-stage--exercise">
  <!--DECOR-->
  <section class="ipb-ex-layout">
    <aside class="ipb-ex-side">
      <div class="ipb-ex-timer">
        <span class="ipb-sec-num">{{remainingSec}}</span>
        <span class="ipb-seconds-lbl">SECONDS</span>
      </div>
      <div class="ipb-set-row">
        <div class="ipb-set-badge">{{set}} SET</div>
        <div class="ipb-vprog"><i></i></div>
      </div>
      <div class="ipb-ex-meta">
        <div class="ipb-round-badge">{{round}}</div>
      </div>
      <p class="ipb-hidden-tokens">{{label}} {{totalSec}} {{setTotal}} {{roundTotal}} {{stepIndex}} {{stepTotal}} {{next.label}} {{pointColor}}</p>
    </aside>
    <div class="ipb-panel ipb-ex-video ipb-video-frame">
      <div data-mvn-video class="ipb-video"></div>
    </div>
  </section>
</div>
