<div class="ipb-stage">
  <!--DECOR-->
  <header class="ipb-hud-top">
    <div class="ipb-glass ipb-hud-glass">
      <div class="ipb-hprog"><i></i><b></b></div>
      <div class="ipb-sec-row">
        <span class="ipb-sec-num">{{remainingSec}}</span>
        <span class="ipb-sec-badge">SEC</span>
      </div>
    </div>
    <div class="ipb-phase">COOL DOWN</div>
  </header>
  <section class="ipb-warmup-layout">
    <div class="ipb-panel ipb-video-frame" style="min-height:620px">
      <div data-mvn-video class="ipb-video"></div>
    </div>
    <div class="ipb-next-col">
      <div class="ipb-glass ipb-next-glass">
        <p class="ipb-next-lbl">NEXT</p>
        <div class="ipb-panel ipb-next-box ipb-video-frame">
          <div data-mvn-next-video class="ipb-video"></div>
        </div>
      </div>
      <p class="ipb-hidden-tokens">{{label}} {{next.label}} {{totalSec}} {{stepIndex}} {{stepTotal}} {{pointColor}}</p>
    </div>
  </section>
</div>
